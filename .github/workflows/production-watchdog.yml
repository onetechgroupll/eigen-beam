name: Production Watchdog

# Pings a deployed instance. Set the repository variable EB_WATCHDOG_URL
# (Settings → Secrets and variables → Actions → Variables) to enable it;
# without it the job is skipped, so forks stay quiet.

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    name: eigen.beam deployment health
    runs-on: ubuntu-latest
    if: ${{ vars.EB_WATCHDOG_URL != '' }}
    timeout-minutes: 5
    env:
      BASE_URL: ${{ vars.EB_WATCHDOG_URL }}
    steps:
      - name: Check liveness
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 20 "$BASE_URL/healthz")"
          echo "$body" | python3 -c 'import json,sys; body=json.load(sys.stdin); assert body.get("ok") is True; assert body.get("service") == "eigenbeam"'
      - name: Check readiness
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 25 "$BASE_URL/readyz")"
          echo "$body" | python3 -c 'import json,sys; body=json.load(sys.stdin); assert body.get("ok") is True; assert body.get("status") == "ready"; assert body.get("service") == "eigenbeam"'
      - name: Check MCP protected-resource metadata
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 20 "$BASE_URL/.well-known/oauth-protected-resource/mcp")"
          echo "$body" | python3 -c 'import json,sys; body=json.load(sys.stdin); assert body.get("resource") == "https://eigen-beam-production.up.railway.app/mcp"; assert "deck:read" in body.get("scopes_supported", [])'
