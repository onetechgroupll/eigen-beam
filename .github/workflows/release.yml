name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# One release build at a time: moving tags (vX.Y, latest) must publish in tag
# order, not race two builders against each other.
concurrency:
  group: release-tags
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/onetechgroupll/eigen-beam

jobs:
  smoke:
    name: Release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build smoke image
        run: docker build --tag eigen-beam:release-smoke .

      - name: Run release smoke
        run: node scripts/release-smoke.mjs --image eigen-beam:release-smoke

  publish-image:
    name: Publish multi-platform image
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate semantic version and compute tags
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$tag" =~ $semver ]]; then
            echo "Expected a stable semantic-version tag such as v1.2.3 (no leading zeros)" >&2
            exit 1
          fi
          echo "minor=v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          # `latest` only moves forward: a backport or a racing tag must never
          # pull it back to an older version.
          git fetch --tags --force
          highest="$(git tag -l | grep -E "$semver" | grep -v "^${tag}$" | sort -V | tail -1 || true)"
          tags="${IMAGE_NAME}:${tag}"$'\n'"${IMAGE_NAME}:v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          if [[ -z "$highest" ]] || [[ "$(printf '%s\n%s\n' "$highest" "$tag" | sort -V | tail -1)" == "$tag" ]]; then
            tags+=$'\n'"${IMAGE_NAME}:latest"
          else
            echo "::notice title=latest unchanged::${highest} is newer than ${tag}; leaving the latest tag alone."
          fi
          {
            echo 'tags<<EOF'
            printf '%s\n' "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}

      # GHCR visibility for org-owned container packages has no REST endpoint;
      # it is a one-time manual setting documented in docs/operations.md
      # (Package settings → Change visibility → Public).

  github-release:
    name: Publish GitHub release
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          awk -v tag="$tag" '
            $0 ~ "^## \\[?" tag "\\]?$" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # An empty section still contains the blank line after the heading;
          # fall back to the commit list only when nothing but whitespace remains.
          if [[ -z "$(tr -d '[:space:]' < release-notes.md)" ]]; then
            previous="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
            if [[ -n "$previous" ]]; then
              git log --pretty='- %s (`%h`)' "${previous}..${tag}" > release-notes.md
            else
              git log --pretty='- %s (`%h`)' "${tag}" > release-notes.md
            fi
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
