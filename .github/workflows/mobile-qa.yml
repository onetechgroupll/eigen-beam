name: Mobile QA Lab

on:
  workflow_dispatch:
    inputs:
      engines:
        description: Playwright engines to run (chromium, webkit, or comma-separated)
        required: false
        default: webkit
      profiles:
        description: Mobile profiles to run (for example iphone-15-pro-dark)
        required: false
        default: iphone-15-pro-dark

permissions:
  contents: read

concurrency:
  group: mobile-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-qa:
    name: mobile qa lab
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EB_MOBILE_QA_BASE: http://127.0.0.1:4317
      EB_MOBILE_QA_OUT: reports/mobile-qa-lab-ci
      EB_DATA_DIR: .data/mobile-qa-ci
      EB_DECK_STORE: file
      EB_ACTIVITY_STORE: off
      EB_MAIL_PROVIDER: outbox
      EB_MAGIC_LINK_SECRET: ci-mobile-qa-secret
      ORIGIN: http://127.0.0.1:4317
      PORT: '4317'
      HOST: 127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright mobile engines
        run: bunx playwright install --with-deps chromium webkit

      - name: Build
        run: bun run build

      - name: Start production build
        run: |
          set -euo pipefail
          rm -rf "$EB_DATA_DIR" "$EB_MOBILE_QA_OUT"
          node build > /tmp/eigenbeam-mobile-qa.log 2>&1 &
          echo "$!" > /tmp/eigenbeam-mobile-qa.pid
          for i in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 3 "$EB_MOBILE_QA_BASE/healthz" >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/eigenbeam-mobile-qa.pid)" 2>/dev/null; then
              cat /tmp/eigenbeam-mobile-qa.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/eigenbeam-mobile-qa.log
          exit 1

      - name: Run mobile QA lab
        env:
          EB_MOBILE_QA_ENGINES: ${{ inputs.engines }}
          EB_MOBILE_QA_PROFILES: ${{ inputs.profiles }}
        run: bun run qa:mobile

      - name: Upload mobile QA report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mobile-qa-lab
          path: reports/mobile-qa-lab-ci
          if-no-files-found: ignore

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: mobile-qa-server-log
          path: /tmp/eigenbeam-mobile-qa.log
          if-no-files-found: ignore
